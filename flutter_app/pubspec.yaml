name: glass_todo_flutter
description: Glass-ToDo 的 Flutter 网页客户端。
publish_to: 'none'
version: 2.0.1+201

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  characters: ^1.3.0
  cupertino_icons: ^1.0.6
  emoji_picker_flutter: ^4.3.0
  file_picker: ^8.1.0
  flutter_riverpod: ^2.6.1
  google_fonts: ^6.2.1
  http: ^1.2.2
  intl: ^0.19.0
  excel: ^4.0.6
  shared_preferences: ^2.2.3
  firebase_core: ^4.3.0
  firebase_messaging: ^16.1.0
  flutter_local_notifications: ^19.5.0
  timezone: ^0.10.1
  flutter_timezone: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.2
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: "ic_launcher"
  ios: false
  image_path: "../logo.png"
  adaptive_icon_background: "#F3EEE4"
  adaptive_icon_foreground: "../logo.png"
