services:
  glass-todo-backend:
    image: "${DOCKER_IMAGE:-hzc073/glass-todo}:${IMAGE_TAG:-latest}"
    env_file:
      - .env.docker
    environment:
      NODE_ENV: production
      PORT: "3000"
      DB_DRIVER: postgres
      DATABASE_URL: "postgresql://${POSTGRES_USER:-glass}:${POSTGRES_PASSWORD:-glass}@postgres:5432/${POSTGRES_DB:-glass_todo}"
      ATTACHMENTS_DIR: /app/data/attachments
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${HOST_PORT:-3000}:3000"
    volumes:
      - "${HOST_DATA_DIR:-../data}:/app/data"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('http').get('http://127.0.0.1:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"
        ]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  postgres:
    image: "postgres:16-alpine"
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-glass}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-glass}"
      POSTGRES_DB: "${POSTGRES_DB:-glass_todo}"
    volumes:
      - "${HOST_DATA_DIR:-../data}/postgres:/var/lib/postgresql/data"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s
