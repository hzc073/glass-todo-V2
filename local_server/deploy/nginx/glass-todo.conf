# Example Nginx reverse proxy config for Glass Todo backend
#
# - Put this file under: /etc/nginx/conf.d/glass-todo.conf (or include it)
# - Replace `todo.example.com` and the upstream port.
#
# NOTE: The `map` block should be placed under the top-level `http {}` in nginx.conf
# if your distro does not allow `map` inside conf.d.
#
# map $http_upgrade $connection_upgrade {
#     default upgrade;
#     ''      close;
# }

server {
    listen 80;
    server_name todo.example.com;

    # Allow >= 50MB uploads (recommend leaving some headroom)
    client_max_body_size 100m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # If you need WebSocket:
        # proxy_set_header Upgrade $http_upgrade;
        # proxy_set_header Connection $connection_upgrade;

        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }
}

